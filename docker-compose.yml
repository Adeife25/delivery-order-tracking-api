# MongoDB runs as a single-node replica set so multi-document transactions work.
# The set advertises "mongo:27017" so containers on this network can discover it.
services:
  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: mongodb://mongo:27017/delivery_tracking?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval "try { db.adminCommand('hello').isWritablePrimary }
          catch (e) { false }" | grep -q true
      interval: 5s
      timeout: 5s
      retries: 10
  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    entrypoint:
      - /bin/bash
      - -c
      - |
        until mongosh --host mongo:27017 --quiet --eval "db.adminCommand({ ping: 1 }).ok" >/dev/null 2>&1; do
          sleep 1
        done
        mongosh --host mongo:27017 --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mongo_data:
  redis_data:
