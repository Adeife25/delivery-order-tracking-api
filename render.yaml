databases:
  - name: delivery-tracking-db
    databaseName: delivery_tracking
    user: delivery_tracking
    plan: free
    region: oregon

services:
  - type: redis
    name: delivery-tracking-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: delivery-order-tracking-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:migrate:deploy && npm run start:prod
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: delivery-tracking-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: delivery-tracking-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: DEFAULT_DELIVERY_FEE
        value: '1500.00'
      - key: DEFAULT_CURRENCY
        value: NGN
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_API_BASE_URL
        value: https://api.paystack.co
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
